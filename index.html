<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人员考勤系统</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 16px; background: #f5f5f5; }
    h1 { text-align: center; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    input, select, button { width: 100%; padding: 12px; margin-top: 8px; font-size: 16px; }
    button { border: none; border-radius: 8px; background: #2563eb; color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { border-bottom: 1px solid #eee; padding: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>人员考勤打卡</h1>

  <!-- 登录部分 -->
  <div class="card" id="login-card">
    <h3>管理员登录</h3>
    <input id="admin-password" type="password" placeholder="请输入管理员密码" />
    <button onclick="adminLogin()">登录</button>
  </div>

  <!-- 打卡部分 -->
  <div class="card" id="check-in-card" style="display:none;">
    <h3>打卡</h3>
    <input id="name" placeholder="请输入姓名" />
    <select id="type">
      <option value="上班">上班</option>
      <option value="下班">下班</option>
    </select>
    <button onclick="checkIn()">提交打卡</button>
  </div>

  <!-- 导出和记录部分 -->
  <div class="card" id="export-card" style="display:none;">
    <button onclick="exportToExcel()">导出考勤记录</button>
  </div>

  <div class="card">
    <h3>全部打卡记录</h3>
    <table>
      <thead>
        <tr><th>姓名</th><th>类型</th><th>时间</th><th>迟到/早退</th></tr>
      </thead>
      <tbody id="records"></tbody>
    </table>
  </div>

<script>
  // ⚠️ 这里填你的 Supabase 信息
  const SUPABASE_URL = 'https://你的项目ID.supabase.co';
  const SUPABASE_KEY = '你的anon public key';

  const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_KEY);
  const recordsEl = document.getElementById('records');
  let isAdmin = false;

  async function load() {
    const { data } = await supabase
      .from('records')
      .select('*')
      .order('created_at', { ascending: false });

    recordsEl.innerHTML = '';
    data.forEach(r => {
      const tr = document.createElement('tr');
      const lateStatus = (r.type === '上班' && new Date(r.created_at).getHours() > 9) ? '迟到' : 
                         (r.type === '下班' && new Date(r.created_at).getHours() < 18) ? '早退' : '';
      tr.innerHTML = `<td>${r.name}</td><td>${r.type}</td><td>${new Date(r.created_at).toLocaleString()}</td><td>${lateStatus}</td>`;
      recordsEl.appendChild(tr);
    });
  }

  async function checkIn() {
    const name = document.getElementById('name').value.trim();
    const type = document.getElementById('type').value;

    if (!name) return alert('请输入姓名');

    const today = new Date().toLocaleDateString();
    const { data } = await supabase
      .from('records')
      .select('*')
      .eq('name', name)
      .like('created_at', `%${today}%`); // 确保每天只能打一次卡

    if (data.length > 0) {
      return alert('今天已经打过卡了！');
    }

    await supabase.from('records').insert([{ name, type, created_at: new Date() }]);
    document.getElementById('name').value = '';
    load();
  }

  async function adminLogin() {
    const password = document.getElementById('admin-password').value;
    if (password === 'admin123') { // 假设管理员密码为 admin123
      isAdmin = true;
      document.getElementById('login-card').style.display = 'none';
      document.getElementById('check-in-card').style.display = 'block';
      document.getElementById('export-card').style.display = 'block';
      load();
    } else {
      alert('密码错误');
    }
  }

  // 导出 Excel
  function exportToExcel() {
    const table = document.createElement('table');
    table.innerHTML = `
      <thead>
        <tr><th>姓名</th><th>类型</th><th>时间</th><th>迟到/早退</th></tr>
      </thead>
      <tbody>
        ${recordsEl.innerHTML}
      </tbody>
    `;

    const wb = XLSX.utils.table_to_book(table);
    XLSX.writeFile(wb, '考勤记录.xlsx');
  }

  load();
</script>
</body>
</html>
